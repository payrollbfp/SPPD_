<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<header>BFP — SPPD & PJPD</header>
<main>
<h2>Starter Migrasi GitHub + Supabase</h2>

<div class="card"><h3>Form PJPD</h3><p>Biaya, rekening, 4 tanda tangan, PDF.</p></div>
<div class="card"><h3>Dashboard</h3><p>Rekap SPPD/PJPD, Tiket, Tagihan.</p></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
